# ege_portal CI — backend pytest (SQLite + gercek PostgreSQL yaris testi) ve frontend.
# ege_lisans bu depoda VENDORLANMISTIR (./ege_lisans) — yol bagimliligi yok.
name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Bagimliliklari kur
        run: pip install -r requirements-dev.txt
      - name: Vendorlanmis ege_lisans kendi manifestiyle tutarli mi
        run: python scripts/ege_lisans_senkron.py --kontrol
      - name: Testler (SQLite bellek ici; PORTAL_PG_URL yok -> PG testleri atlanir)
        run: python -m pytest -q -p no:cacheprovider

  backend-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: ci-yalniz-test-parolasi
          POSTGRES_DB: portal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal -d portal_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Bagimliliklari kur
        run: pip install -r requirements-dev.txt
      - name: Gercek PostgreSQL yaris testi (CI'ya ozel, tek kullanimlik servis)
        env:
          PORTAL_PG_URL: postgresql+psycopg2://portal:ci-yalniz-test-parolasi@localhost:5432/portal_ci
        run: python -m pytest -q -p no:cacheprovider tests/test_postgres_yaris.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
